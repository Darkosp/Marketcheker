<!doctype html>
<html lang="mk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>{% block title %}{{ title|default("Marketchecker") }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.4/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Marketchecker</a>
  </header>

  <main id="content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <small>Цените се од јавните ценовници на маркетите. Проверете на лице место.</small>
  </footer>
</body>
</html>
