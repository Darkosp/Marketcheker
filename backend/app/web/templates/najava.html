{% extends "base.html" %}

{% block body %}
<div class="layout layout-single">
  <main class="content auth">

    <section class="page-head">
      <h1>Влез</h1>
      <p class="subtitle">
        Напиши ја адресата и ќе ти стигне линк. Нема лозинка.
      </p>
    </section>

    <form class="auth-form" method="post" action="/najava">
      <label class="field">
        <span class="field-label">Е-пошта</span>
        <input class="auth-input" type="text" name="posta" value="{{ posta|default('') }}"
               autocomplete="email" autocapitalize="none" spellcheck="false"
               inputmode="email" required autofocus>
        <span class="auth-hint">Може и корисничкото име, ако го памети подобро.</span>
      </label>

      <button class="btn auth-submit" type="submit">Прати ми линк</button>
    </form>

    <p class="auth-switch">
      Немаш сметка? <a href="/registracija">Направи сметка</a>
    </p>

  </main>
</div>
{% endblock %}
