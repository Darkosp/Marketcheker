{% extends "base.html" %}

{% block body %}
<div class="layout layout-single">
  <main class="content auth">

    <section class="page-head">
      <h1>Влез</h1>
      <p class="subtitle">
        Напиши ја адресата со која ја отвори сметката. Нема лозинка.
      </p>
    </section>

    <form class="auth-form" method="post" action="/najava">
      {% if error %}
        <p class="auth-error" role="alert">{{ error }}</p>
      {% endif %}

      <label class="field">
        <span class="field-label">Е-пошта</span>
        <input class="auth-input" type="email" name="posta" value="{{ posta|default('') }}"
               autocomplete="email" autocapitalize="none" spellcheck="false"
               inputmode="email" required>
      </label>

      <button class="btn auth-submit" type="submit">Влези</button>
    </form>

    <p class="auth-switch">
      Немаш сметка? <a href="/registracija">Направи сметка</a>
    </p>

  </main>
</div>
{% endblock %}
