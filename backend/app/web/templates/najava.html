{% extends "base.html" %}

{% block body %}
<div class="layout layout-single">
  <main class="content auth">

    <section class="page-head">
      <h1>Најава</h1>
      <p class="subtitle">
        За да ја видиш твојата листа онаква каква што ја остави.
      </p>
    </section>

    <form class="auth-form" method="post" action="/najava">
      {% if error %}
        <p class="auth-error" role="alert">{{ error }}</p>
      {% endif %}

      <label class="field">
        <span class="field-label">Корисничко име</span>
        <input class="auth-input" type="text" name="ime" value="{{ ime|default('') }}"
               autocomplete="username" autocapitalize="none" spellcheck="false"
               required autofocus>
      </label>

      <label class="field">
        <span class="field-label">Лозинка</span>
        <input class="auth-input" type="password" name="lozinka"
               autocomplete="current-password" required>
      </label>

      <button class="btn auth-submit" type="submit">Најави се</button>
    </form>

    <p class="auth-switch">
      Немаш сметка? <a href="/registracija">Направи сметка</a>
    </p>

  </main>
</div>
{% endblock %}
