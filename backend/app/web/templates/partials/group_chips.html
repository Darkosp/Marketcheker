{# Копчињата за групи. При HTMX барање се враќаат и одделно (out-of-band),
   за да означеното копче се освежи иако се менува само списокот. #}
<div class="chips" id="grupi"{% if oob %} hx-swap-oob="true"{% endif %}>
  <button type="submit" name="grupa" value=""
          class="chip {% if not selected.grupa %}chip-on{% endif %}">
    сите
  </button>
  {% for slug, name, count in group_counts %}
    <button type="submit" name="grupa" value="{{ slug }}"
            class="chip {% if selected.grupa == slug %}chip-on{% endif %}">
      {{ name }} <b>{{ count }}</b>
    </button>
  {% endfor %}
</div>
